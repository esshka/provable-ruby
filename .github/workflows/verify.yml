name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The checker needs Prism >= 1.2 (CaseNode#else_clause); the gem pins that on any Ruby.
      - run: gem install prism --no-document
      # Installs the toolchain from lean-toolchain only; bin/verify runs the build.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - run: for t in test/*_test.rb; do ruby "$t"; done
      - run: bin/verify
