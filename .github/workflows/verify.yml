name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # Ruby 3.4 bundles Prism >= 1.0, which the checker and translator need.
      # Installs the toolchain from lean-toolchain only; bin/verify runs the build.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - run: for t in test/*_test.rb; do ruby "$t"; done
      - run: bin/verify
